name: Release a new docker image upon tagging

on:
  workflow_call:
    inputs:
      DOCKER_IMAGE_NAME:
        description: "The name of the docker image. E.g.: um-kernel"
        required: true
        type: string
      DOCKER_TAG_PREFIX:
        description: "The prefix used to tag the image. It will be used to extract the version. E.g.: docker_img-"
        required: false
        default: 'docker_img-'
        type: string
      embedded_workflows_branch:
        description: 'Branch to checkout embedded-workflows repo'
        type: string
        required: false
        default: 'EMB-115_migrate_to_gar'  # TODO: Change to `main` once merged

env:
  DOCKER_REGISTRY: ${{ vars.EMB_DOCKER_REGISTRY || 'europe-west1-docker.pkg.dev' }}
  DOCKER_PROJECT: ${{ vars.EMB_GCP_PROJECT }}
  DOCKER_REPOSITORY: ${{ vars.EMB_DOCKER_REPOSITORY }}
  DOCKER_IMAGE_NAME: ${{ inputs.DOCKER_IMAGE_NAME }}
  DOCKER_TAG_PREFIX: ${{ inputs.DOCKER_TAG_PREFIX }}

jobs:
  Build:
    name: 'Build and Release Docker Image'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ULTIMAKER_CI_PAT }}  # TODO: Replace with GITHUB_TOKEN - See https://ultimaker.atlassian.net/browse/EMB-120
          submodules: recursive

      - name: Checkout Embedded-workflows repo
        uses: actions/checkout@v4
        with:
          repository: Ultimaker/embedded-workflows
          path: embedded-workflows
          ref: ${{ inputs.embedded_workflows_branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to Google Cloud using Workload Identity Federation
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ vars.EMB_WI_PROVIDER }}
          service_account: ${{ vars.EMB_DOCKER_SERVICE_ACCOUNT }}

      # Login to Google Artifact Registry
      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # Extract version from tag
      - name: Extract Version
        id: version
        run: |
          # Remove the tag prefix to make the version
          export DOCKER_IMAGE_VERSION="${GITHUB_REF_NAME##${DOCKER_TAG_PREFIX}}"
          echo "DOCKER_IMAGE_VERSION=${DOCKER_IMAGE_VERSION}" >> $GITHUB_OUTPUT
          echo "DOCKER_IMAGE_VERSION: ${DOCKER_IMAGE_VERSION}"

      # Generate Docker metadata (tags and labels)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_PROJECT }}/${{ env.DOCKER_REPOSITORY }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.DOCKER_IMAGE_VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.DOCKER_IMAGE_VERSION }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.DOCKER_IMAGE_VERSION }}
          flavor: |
            latest=auto

      # Build and push the Docker image
      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker_env/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_PROJECT }}/${{ env.DOCKER_REPOSITORY }}/${{ env.DOCKER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_PROJECT }}/${{ env.DOCKER_REPOSITORY }}/${{ env.DOCKER_IMAGE_NAME }}:buildcache,mode=max
          provenance: false  # Disable provenance attestation for compatibility

      # Generate release summary
      - name: Generate Summary
        run: |
          set -euo pipefail
          
          echo "# Docker Image Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Image Information" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image Name**: \`${{ env.DOCKER_IMAGE_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: \`${{ steps.version.outputs.DOCKER_IMAGE_VERSION }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Registry**: \`${{ env.DOCKER_REGISTRY }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Digest**: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Tags" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Security Features" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Workload Identity Federation (no long-lived secrets)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ OAuth2 access token authentication" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Semantic versioning from git tags" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Layer caching for efficient builds" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Multi-platform buildx support" >> "$GITHUB_STEP_SUMMARY"
