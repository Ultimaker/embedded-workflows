name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      DOCKER_IMAGE_NAME:
        description: "The name of the docker image (without registry/project prefix)"
        required: true
        type: string
      DOCKER_CONTEXT:
        description: "Docker build context path"
        required: false
        default: '.'
        type: string
      DOCKERFILE_PATH:
        description: "Path to Dockerfile"
        required: false
        default: 'docker_env/Dockerfile'
        type: string
      BUILD_ARGS:
        description: "Additional build arguments (multiline string)"
        required: false
        default: ''
        type: string
      PUSH_IMAGE:
        description: "Whether to push the image to registry"
        required: false
        default: true
        type: boolean
      embedded_workflows_branch:
        description: 'Branch to checkout embedded-workflows repo'
        type: string
        required: false
        default: 'EMB-115_migrate_to_gar'  # TODO: Change to `main` once merged
    outputs:
      IMAGE_TAG:
        description: "Full image tag that was built"
        value: ${{ jobs.Build_Docker.outputs.IMAGE_TAG }}
      IMAGE_DIGEST:
        description: "Image digest"
        value: ${{ jobs.Build_Docker.outputs.IMAGE_DIGEST }}

env:
  DOCKER_REGISTRY: ${{ vars.EMB_DOCKER_REGISTRY }}
  DOCKER_PROJECT: ${{ vars.EMB_GCP_PROJECT }}
  DOCKER_REPOSITORY: ${{ vars.EMB_DOCKER_REPOSITORY }}

jobs:
  Build_Docker:
    name: 'Build and Push Docker Image'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    outputs:
      IMAGE_TAG: ${{ steps.meta.outputs.tags }}
      IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ULTIMAKER_CI_PAT }}  # TODO: Replace with GITHUB_TOKEN - See https://ultimaker.atlassian.net/browse/EMB-120
          submodules: recursive

      - name: Checkout Embedded-workflows repo
        uses: actions/checkout@v4
        with:
          repository: Ultimaker/embedded-workflows
          path: embedded-workflows
          ref: ${{ inputs.embedded_workflows_branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      # Authenticate to Google Cloud using Workload Identity Federation
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ vars.EMB_WI_PROVIDER }}
          service_account: ${{ vars.EMB_DOCKER_SERVICE_ACCOUNT }}

      # Login to Google Artifact Registry
      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # Generate Docker metadata (tags and labels)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_PROJECT }}/${{ env.DOCKER_REPOSITORY }}/${{ inputs.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-,format=short
          flavor: |
            latest=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      # Build and optionally push the Docker image
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.DOCKER_CONTEXT }}
          file: ${{ inputs.DOCKERFILE_PATH }}
          push: ${{ inputs.PUSH_IMAGE && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ inputs.BUILD_ARGS }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_PROJECT }}/${{ env.DOCKER_REPOSITORY }}/${{ inputs.DOCKER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_PROJECT }}/${{ env.DOCKER_REPOSITORY }}/${{ inputs.DOCKER_IMAGE_NAME }}:buildcache,mode=max
          provenance: false  # Disable provenance attestation for compatibility

      # Generate build summary
      - name: Generate Summary
        run: |
          set -euo pipefail
          
          echo "# Docker Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Image Information" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image Name**: \`${{ inputs.DOCKER_IMAGE_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Registry**: \`${{ env.DOCKER_REGISTRY }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Project**: \`${{ env.DOCKER_PROJECT }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Repository**: \`${{ env.DOCKER_REPOSITORY }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Build Details" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Pushed**: \`${{ inputs.PUSH_IMAGE && github.event_name != 'pull_request' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Digest**: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Tags" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
