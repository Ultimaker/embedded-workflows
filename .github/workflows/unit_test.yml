on:
  workflow_call:

jobs:
  Unit_Test:
    name: 'Unit Test'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ULTIMAKER_CI_PAT }}
          submodules: recursive

      - name: Unit Test
        id: unittest
        run: |
          ./build_for_ultimaker.sh -a unittest
