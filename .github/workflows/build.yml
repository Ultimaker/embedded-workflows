on:
  workflow_call:
    inputs:
      RELEASE_VERSION:
        description: "The version to build the package"
        required: true
        type: string
      embedded_workflows_branch:
        description: 'Branch to checkout embedded-workflows repo'
        type: string
        required: false
        default: 'EMB-115_migrate_to_gar'  # TODO: Change to `main` once merged

jobs:
  Build:
    name: 'Build Package'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      RELEASE_VERSION: ${{ inputs.RELEASE_VERSION }}
      DOCKER_REGISTRY: ${{ vars.EMB_DOCKER_REGISTRY }}
      DOCKER_PROJECT: ${{ vars.EMB_GCP_PROJECT }}
      DOCKER_REPOSITORY: ${{ vars.EMB_DOCKER_REPOSITORY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ULTIMAKER_CI_PAT }}  # TODO: Replace with GITHUB_TOKEN - See https://ultimaker.atlassian.net/browse/EMB-120
          submodules: recursive

      - name: Checkout Embedded-workflows repo
        uses: actions/checkout@v4
        with:
          repository: Ultimaker/embedded-workflows
          path: embedded-workflows
          ref: ${{ inputs.embedded_workflows_branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to Google Cloud using Workload Identity Federation
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ vars.EMB_WI_PROVIDER }}
          service_account: ${{ vars.EMB_DOCKER_SERVICE_ACCOUNT }}

      # Login to Google Artifact Registry for Docker operations
      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build Package
        id: build
        run: |
          # BUILDTYPE is used by the build of premium firmware modules such
          # as print-process-reporting. "PRODUCTION" triggers the build of
          # an encrypted firmware module using Ultimaker/umlicensemanager.
          # Other firmware components ignore this.
          export BUILDTYPE=PRODUCTION
          export RELEASE_VERSION="${{ env.RELEASE_VERSION }}"
          echo "RELEASE_VERSION: ${RELEASE_VERSION}"
          
          # Use the centralized build script from embedded-workflows
          # Pass encryption key directly to the build script, not as global export
          UMLM_ENCRYPTION_KEY="${{ secrets.UMLM_ENCRYPTION_KEY }}" ./embedded-workflows/scripts/build_for_ultimaker.sh -a build

      - name: Upload Artifact (Built package)
        uses: actions/upload-artifact@v4
        with:
          name: build-package
          path: "./*.deb"
